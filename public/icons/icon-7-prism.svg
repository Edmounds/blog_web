<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="114" fill="#ffffff" />
  <!-- Triangular prism -->
  <polygon points="256 120, 140 340, 372 340" fill="none" stroke="#1d1d1f" stroke-width="24" stroke-linejoin="round" />
  <!-- Refracting light ray entering -->
  <line x1="60" y1="260" x2="200" y2="230" stroke="#7a7a7a" stroke-width="16" stroke-linecap="round" />
  <!-- Exiting refracted rays (one Action Blue and one muted ink) -->
  <line x1="310" y1="230" x2="452" y2="200" stroke="#0066cc" stroke-width="20" stroke-linecap="round" />
  <line x1="325" y1="260" x2="452" y2="260" stroke="#1d1d1f" stroke-width="16" stroke-linecap="round" />
</svg>
