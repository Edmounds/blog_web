   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start" x="17.82" y="27.2088" transform="rotate(-0 17.82 27.2088)">Same source images and boxes; different supervision</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58636b" x="17.82" y="52.7112" transform="rotate(-0 17.82 52.7112)">Zone routing, initialization, validation and detector training settings are shared.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(37.281016 149.852578)">Same full image</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(48.678906 166.349312)">Known zone</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(37 182.846047)">Fruit / vegetable</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(245.922891 104.046945)">A  ·  YOLO26s</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(206.563516 120.54368)">4 fruit / 8 vegetable classes</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(498.987031 103.893977)">Type + state in one label</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(507.067734 120.390711)">Example: pepper_ripe</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(245.911719 217.698945)">B  ·  YOLO26s</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(206.563516 234.19568)">2 fruit / 4 vegetable classes</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(419.922969 217.698945)">Predicted box crop</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(432.699297 234.19568)">Route by type</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(586.895625 217.698945)">MobileNetV3</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(588.205312 234.19568)">ripe / unripe</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58636b" x="190.8" y="276.6888" transform="rotate(-0 190.8 276.6888)">Red and green peppers share one type label; each fruit type has its own maturity rule.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58636b" x="20.61" y="303.3" transform="rotate(-0 20.61 303.3)">2,460 train images + 250 validation images   |   no bad class or third stage   |   six separate maturity classifiers in B</text>
   </g>
  </g>
